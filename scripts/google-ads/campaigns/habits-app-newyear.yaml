# =============================================================================
# Friends with Habits — New Year resolution install burst (App campaign, run 2)
#
#   ./therrads campaign validate campaigns/habits-app-newyear.yaml
#   ./therrads campaign plan     campaigns/habits-app-newyear.yaml
#   ./therrads campaign apply    campaigns/habits-app-newyear.yaml --confirm
#
# WHY NOW: January 1 is the biggest "fresh start" landmark of the year (Dai,
# Milkman & Riis 2014; see docs/HABIT_LIFECYCLE_MESSAGING.md), the one window
# when a cold install arrives already wanting a new habit. Competitors know it
# too, so expect CPI above the Q3 run's $5.43.
#
# WHAT RUN 1 SAID (FwH-App-US-Installs-2026Q3, 2026-10-09 to 2026-10-19, ended
# on its end date): $81.47 for 15 installs ($5.43 each). In GA4 (property
# 267810693, stream "Friends with Habits", 5 Oct - 24 Nov 2026), paid users
# reached a check-in far less often than everyone else:
#
#     first user medium   first_open   habit_checkin_complete   app_remove
#     cpc                         32              2  (6%)          17
#     organic                     47             16 (34%)          38
#     referral                    19              7 (37%)           9
#
# Fifteen installs is under the 30 the analyzer needs for a verdict, so run 1
# answered nothing. This run is priced to reach 30+ installs in the one window
# where paid intent should be closest to organic.
#
# WHAT HAS CHANGED SINCE RUN 1 (ship before this goes live, or the comparison
# measures the old app): solo habits before any invite, the first-session
# check-in, the comeback ladder, and (niche/HABITS-general c85012239) a second
# notification ask on the third check-in day plus a review prompt habits users
# can actually reach. Paid installs land on whatever Play build is live.
# =============================================================================

hypothesis: >
  In the New Year window, Friends with Habits can buy installs in English-
  speaking markets at or under $6.00 CPI, and at least 15% of those installs
  complete a check-in (habit_checkin_complete, firstUserMedium = cpc), against
  6% for run 1's October cohort. If CPI holds but check-ins stay near 6%, the
  limit is the product's first session rather than the season, and no later
  paid run should launch until that number moves. If check-ins reach 15%, the
  next run is a smaller always-on budget bidding on habit_checkin_complete.

  Read check-ins as an aggregate shift, not an attribution: an App campaign
  install carries no UTM into main."userAcquisition" until the Play Install
  Referrer work ships (docs/WORK_IN_PROGRESS.md). Compare the cpc row above with
  the same GA4 report run over 26 Dec - 23 Jan.

campaign:
    name: "FwH-App-EN-NewYear-2027"
    kind: app_install
    app_id: "com.therr.habits"
    app_store: GOOGLE_APP_STORE
    # Always PAUSED on creation (enforced by tests/test_spec.py). Review in the Ads
    # UI, attach the images and videos below by hand, then
    # `./therrads campaign resume "FwH-App-EN-NewYear-2027" --confirm`.
    status: PAUSED
    # Starts before the 1st so the learning phase (~5-7 days) is mostly spent by
    # the time resolution intent peaks in the first week of January. The end date
    # is the hard stop on spend, and it is past the point most resolutions are
    # dropped, so the window also covers the users who try again.
    start_date: "2026-12-26"
    end_date: "2027-01-11"

budget:
    # 17 days x $18 = $306 ceiling. At run 1's $5.43 that is ~55 installs; at a
    # New-Year-inflated $8 it is still ~38, so either way it clears the analyzer's
    # 30-install minimum. Do not raise mid-flight by more than 20% a step, or the
    # learning phase restarts.
    daily: 18.00
    currency: USD
    delivery: STANDARD

bidding:
    # Installs, not in-app actions. habit_checkin_complete is now emitted, but at
    # roughly one paid check-in a week it is nowhere near the ~10 conversions/day
    # OPTIMIZE_IN_APP_CONVERSIONS needs. Run 1's $2.50 target starved delivery
    # (its own spec predicted that); $5.00 is just under what run 1 actually paid.
    goal: OPTIMIZE_INSTALLS_TARGET_INSTALL_COST
    target_cpa: 5.00

targeting:
    # 2840 United States, 2826 United Kingdom, 2124 Canada, 2036 Australia.
    # English only: the Play listing copy is en-US only (see habits-app-install.yaml).
    # Widened from US-only because November's organic and Reddit-swap installs
    # came mostly from outside the US (GA4 new users 10-24 Nov: US 11, UK 5, India 9),
    # and US CPI is the most contested in January. India is left out on purpose:
    # its installs would come in at the cheapest CPI and pull the average CPI down
    # without telling us anything about the markets the app is priced for.
    location_ids: ["2840", "2826", "2124", "2036"]
    language_ids: ["1000"]
    notes: >
      Four English-speaking markets, no audience targeting (App campaigns have
      none). Geography is the only segmentation lever; read CPI per country in
      the Ads UI before deciding whether the next run narrows it.

assets:
    # <=30 chars each, 2-5. Every headline stands alone: Google combines freely.
    # Two run-1 headlines are kept as controls so the New Year ones are compared
    # against a known baseline rather than against nothing.
    headlines:
        - "Keep Your Resolution This Year"  # 30
        - "New Year, New Habit"             # 19
        - "Resolutions Stick With a Buddy"  # 30
        - "Habits That Actually Stick"      # 25 (run 1 control)
        - "Don't Break the Streak"          # 22 (run 1 control)
    # <=90 chars each, 1-5. No statistics: anything here has to be true of the app
    # as shipped, and the resolution-failure numbers that circulate are not ones we
    # can source.
    descriptions:
        - "Make this year's resolution a pact with a friend. You check in, they check in."
        - "Start a habit for the new year with a partner who notices when you skip. Free to start."
        - "Track habits solo or with a friend, with streaks and photo check-ins. Free to start."
        - "Every habit is a pact with a friend. You check in, they check in, the streak lives."
    # NOT UPLOADED BY THIS TOOL. Attach in the Ads UI. Same frames as run 1; a
    # New Year frame set (build_frames.py) is optional, and the copy carries the
    # season without it.
    images:
        - scripts/google-ads/assets/habits/landscape-1200x628-streak.png
        - scripts/google-ads/assets/habits/landscape-1200x628-pact.png
        - scripts/google-ads/assets/habits/landscape-1200x628-partner.png
        - scripts/google-ads/assets/habits/square-1200x1200-streak.png
        - scripts/google-ads/assets/habits/square-1200x1200-pact.png
        - scripts/google-ads/assets/habits/square-1200x1200-partner.png
        - scripts/google-ads/assets/habits/portrait-1200x1500-streak.png
        - scripts/google-ads/assets/habits/portrait-1200x1500-pact.png
        - scripts/google-ads/assets/habits/portrait-1200x1500-partner.png
    videos:
        # 14s portrait (2026-09-29), the one video run 1 actually served.
        - "https://www.youtube.com/watch?v=8IArnFqK0Sw"
        # 15s "Evolve your life" Short (re-cut 2026-11-16): a new habit with a
        # friend's help, which is the resolution story. Never served yet.
        - "https://www.youtube.com/watch?v=JpadSvoOXUs"
        # Not the 2026-10-01 coach Short: it still promises a coach feature the
        # app does not have (see habits-app-install.yaml).

tracking:
    # Documentation and reporting-join only; an App campaign appends these to
    # nothing. New value, never reused: utm_campaign is immutable once served.
    utm_source: google
    utm_medium: cpc
    utm_campaign: fwh-app-en-newyear-2027
