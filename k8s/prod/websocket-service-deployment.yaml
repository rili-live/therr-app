apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service-deployment
  namespace: default
spec:
  replicas: 1
  # Recreate tore down the old pod BEFORE the new one existed. At replicas: 1 that
  # is a guaranteed zero-endpoint window on every deploy — the source of the
  # "Service default/websocket-service-cluster-ip-service does not have any active
  # Endpoint" flood from the ingress controller. maxUnavailable: 0 keeps the
  # running pod holding its sockets until the replacement passes readiness.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A pod that answers /healthcheck once and then dies shouldn't retire the old one.
  minReadySeconds: 15
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      component: server-websocket
  template:
    metadata:
      labels:
        component: server-websocket
        tier: microservices
        layer: services-external
    spec:
      serviceAccountName: therr-k8s-service-account
      # src/index.ts has no SIGTERM handler, so the process exits as soon as the
      # signal lands. The preStop sleep holds the container open while kube-proxy
      # removes this pod from the Service, so new socket upgrades land on the
      # replacement instead of a pod that is about to die. 30s leaves 15s of slack
      # past the sleep.
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: cloud.google.com/gke-preemptible
                operator: DoesNotExist
            weight: 100
      containers:
      - name: server-websocket
        image: therrapp/websocket-service:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "96Mi"
            cpu: "10m"
          limits:
            memory: "192Mi"
            cpu: "350m"
        ports:
        - containerPort: 7743
        startupProbe:
          httpGet:
            path: /healthcheck
            port: 7743
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 7743
          initialDelaySeconds: 0
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 7743
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        # Endpoint removal and SIGTERM race each other. Sleeping here keeps the
        # process serving while kube-proxy/ingress finish dropping this pod from
        # rotation, so the ingress stops reporting zero active endpoints mid-deploy.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"]
        env:
        - name: MESSAGES_SERVICE_API_PORT
          value: "7772"
        - name: HONEYCOMB_API_KEY
          valueFrom:
            secretKeyRef:
              name: honeycomb-writekey
              key: HONEYCOMB
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_PUB_HOST
          value: "redis-cluster-ip-service"
        - name: REDIS_PUB_PORT
          value: "6379"
        - name: SOCKET_PORT
          value: "7743"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: therrjwtsecret
              key: THERRJWT_SECRET
        - name: JWT_ISSUER
          value: "https://api.therr.com"
        - name: JWT_AUDIENCE
          value: "therr-app"
