# cert-manager-values.yaml
#
# cert-manager is installed via Helm (release "cert-manager", namespace
# "cert-manager"). It was installed WITHOUT a values file, so all three of its
# pods ran as BestEffort -- no CPU or memory requests at all.
#
# On main-pool (a single e2-small, 940m CPU / ~1.33Gi allocatable, of which
# kube-system DaemonSets alone request 648m) BestEffort pods are scheduled last
# and starved first. The result was a chronic restart loop:
#
#   cert-manager-webhook      29 restarts
#   cert-manager-cainjector    1 restart
#
# all with "context deadline exceeded" probe failures -- i.e. kubelet's HTTP
# probe timing out under CPU contention, not the process being unhealthy.
# A flapping webhook is a TLS-renewal risk, so these pods need a guaranteed
# scheduler share.
#
# Requests below are sized to ~1.5x observed steady-state usage:
#
#   pod          observed        request
#   cainjector   3m  / 43Mi      10m / 64Mi
#   controller   2m  / 27Mi      10m / 40Mi
#   webhook      1m  / 10Mi      10m / 24Mi
#
# No limits are set deliberately: CPU limits would reintroduce throttling on a
# node this tight, and these are latency-sensitive control-plane components.
#
# INSTALLED: chart and app v1.21.2 (2026-10-13, upgraded one minor at a time
# from v1.9.0). v1.9.0 could no longer renew: its Cloudflare DNS-01 solver
# built the cleanup DELETE URL from each DNS record's `zone_id`, which
# Cloudflare stopped returning in early 2025 (cert-manager #7540, fixed in
# v1.17.1), so every challenge failed on `/zones//dns_records/<id>`. CRDs are
# Helm-managed via `crds.enabled` (the old `installCRDs` was renamed in v1.15).
#
# TLS for each host list comes only from k8s/prod/certificate*.yaml. Do not
# add `cert-manager.io/cluster-issuer` to an Ingress: ingress-shim would create
# a second Certificate for the same secretName.
#
# Checking a renewal: the public hostnames are Cloudflare-proxied, so
# `openssl s_client -connect therr.com:443` shows Cloudflare's edge cert. Ask
# the origin instead:
#   echo | openssl s_client -servername api.therr.com \
#     -connect "$(kubectl get svc therr-ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')":443 \
#     2>/dev/null | openssl x509 -noout -enddate
#
# Usage (re-apply these values without changing the version — pin --version to
# the installed chart, and step through each minor's release notes to upgrade):
#   helm repo add jetstack https://charts.jetstack.io && helm repo update
#   helm upgrade cert-manager jetstack/cert-manager \
#     --namespace cert-manager \
#     --version v1.21.2 \
#     --set crds.enabled=true --set crds.keep=true \
#     -f k8s/prod/values/cert-manager-values.yaml

resources:
  requests:
    cpu: 10m
    memory: 40Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
