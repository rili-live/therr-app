apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service-deployment
  namespace: default
spec:
  replicas: 1
  # Recreate tore down the old pod BEFORE the new one existed, so any slow or
  # failed start became a hard outage instead of a stalled rollout. maxUnavailable: 0
  # keeps the running pod serving until the replacement passes its readiness probe.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A pod that answers /healthcheck once and then dies shouldn't retire the old one.
  minReadySeconds: 15
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      component: server-users
  template:
    metadata:
      labels:
        component: server-users
        tier: microservices
        layer: services-internal
    spec:
      serviceAccountName: therr-k8s-service-account
      # Must exceed the preStop sleep (15s) plus the in-flight request drain in
      # index.ts, otherwise SIGKILL lands mid-request during every deploy.
      terminationGracePeriodSeconds: 45
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: cloud.google.com/gke-preemptible
                operator: DoesNotExist
            weight: 100
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - server-users
              topologyKey: kubernetes.io/hostname
      containers:
      - name: server-users
        image: therrapp/users-service:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        # Deliberately left alone. Observed steady state is 1m CPU / 100Mi against
        # this 15m request and 384Mi limit, and main-pool is the constrained node
        # (memory requests at ~92% of a 1358Mi allocatable). Raising the request
        # here buys nothing and only makes the pod harder to schedule.
        resources:
          requests:
            memory: "128Mi"
            cpu: "15m"
          limits:
            memory: "384Mi"
            cpu: "350m"
        ports:
        - containerPort: 7771
        # Boot is CPU-bound (webpack bundle parse + OpenTelemetry patching every
        # auto-instrumented module, all before app.listen binds 7771), and the
        # 350m limit is a third of a core, so on a contended node it can overrun
        # the old 12 x 5s budget. Failed startup probes are free until the
        # threshold is exhausted — the container is not restarted — so budget
        # generously: 36 x 5s = 180s. initialDelaySeconds is 0 because a refused
        # connection just costs one cheap failure, and dropping the delay lets a
        # fast boot go Ready sooner.
        startupProbe:
          httpGet:
            path: /healthcheck
            port: 7771
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 7771
          initialDelaySeconds: 0
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 7771
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        # Endpoint removal and SIGTERM race each other. Sleeping here keeps the
        # process serving while kube-proxy/ingress finish dropping this pod from
        # rotation, so the gateway stops seeing connection-refused mid-deploy.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"]
        env:
        - name: AWS_SES_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-ses-access-key-id
              key: AWSSESACCESSKEYID
        - name: AWS_SES_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: aws-ses-access-key-secret
              key: AWSSESACCESSKEYSECRET
        - name: AWS_SES_REGION
          value: "us-east-2"
        - name: AWS_SES_FROM_EMAIL
          value: 'info@therr.com'
        - name: AWS_FEEDBACK_EMAIL_ADDRESS
          value: "info@therr.com"
        - name: AWS_NOTIFY_ADMIN_EMAIL_ADDRESSES
          value: "zanselm@therr.com"
        - name: USERS_SERVICE_API_PORT
          value: "7771"
        - name: URI_WHITELIST
          value: "https://therr.com,https://www.therr.com,https://therr.app,https://www.therr.app"
        - name: HONEYCOMB_API_KEY
          valueFrom:
            secretKeyRef:
              name: honeycomb-writekey
              key: HONEYCOMB
        - name: FACEBOOK_APP_ID
          value: "1384683965734062"
        - name: FACEBOOK_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: facebook-app-secret
              key: FACEBOOKAPPSECRET
        - name: INSTAGRAM_APP_ID
          value: "8038208602859743"
        - name: INSTAGRAM_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: instagram-app-secret
              key: INSTAGRAMAPPSECRET
        - name: LOG_LEVEL
          value: "info"
        # Drains main.notificationQueue on a 30s interval and sends what is due
        # (src/utilities/notificationQueueWorker.ts). Absent or anything other
        # than "true" leaves the worker inert, which is how the table shipped —
        # the queue was deployed dark so it could be observed filling before it
        # was allowed to send. Now that the habits digest queues instead of
        # sending inline, unsetting this stops those notifications entirely
        # rather than reverting to the old path. Only ever one replica runs this,
        # but the claim uses SKIP LOCKED, so a scale-up would not double-send.
        - name: NOTIFICATION_QUEUE_WORKER_ENABLED
          value: "true"
        # Turns on the habit lifecycle engine in the digest
        # (src/utilities/habitLifecycleContext.ts) — must be exactly "true".
        # This is the mirror image of the flag above: that one guards against
        # sending too much, this one against sending too little, because
        # enabling it *removes* daily reminders from users who currently get
        # them. It depends on the queue worker above; with that off the
        # lifecycle pushes queue and nothing is delivered. Expect a backfill
        # burst on the first digest run after this lands — every existing
        # long-running habit is evaluated against the gates at once. Watch
        # `nudgesTapered` in the digest response; that number rising is the
        # only direct evidence the taper is cutting volume rather than adding
        # four new message types on top. See docs/HABIT_LIFECYCLE_MESSAGING.md.
        - name: HABIT_PHASE_ENGINE_ENABLED
          value: "true"
        - name: REDIS_PUB_HOST
          value: "redis-cluster-ip-service"
        - name: REDIS_PUB_PORT
          value: "6379"
        # src/store/redisClient.ts reads these. Without them the port was
        # Number(undefined) === NaN, so ioredis rejected the socket outright —
        # production logs `RangeError [ERR_SOCKET_BAD_PORT]` on every boot and
        # the client never connects at all. Cross-app handoff codes and the
        # thought-distributor gate have therefore never worked in production.
        - name: REDIS_EPHEMERAL_HOST
          value: "redis-ephemeral-cluster-ip-service"
        - name: REDIS_EPHEMERAL_PORT
          value: "6380"
        - name: TIKTOK_CLIENT_KEY
          valueFrom:
            secretKeyRef:
              name: tiktok-client-key
              key: TIKTOKCLIENTKEY
        - name: TIKTOK_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: tiktok-app-secret
              key: TIKTOKAPPSECRET
        - name: DB_USER_MAIN_WRITE
          value: "therrAppUser"
        - name: DB_HOST_MAIN_WRITE
          value: "127.0.0.1"
        - name: DB_PORT_MAIN_WRITE
          value: "5432"
        - name: DB_PASSWORD_MAIN_WRITE
          valueFrom:
            secretKeyRef:
              name: db-password-app
              key: DB_PASSWORD_APP_WRITE
        - name: DB_USER_MAIN_READ
          value: "therrAppUser"
        - name: DB_HOST_MAIN_READ
          value: "127.0.0.1"
        - name: DB_PORT_MAIN_READ
          value: "5432"
        - name: DB_PASSWORD_MAIN_READ
          valueFrom:
            secretKeyRef:
              name: db-password-app
              key: DB_PASSWORD_APP_READ
        - name: GOOGLE_MAPS_PLACES_SERVER_SIDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-maps-places-server-side-api-key
              key: GOOGLE_MAPS_PLACES_SERVER_SIDE_API_KEY
        - name: PLAID_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: plaid-secret-key
              key: PLAIDSECRETKEY
        - name: USERS_SERVICE_DATABASE
          value: "therr_users_service_db"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: therrjwtsecret
              key: THERRJWT_SECRET
        - name: JWT_ISSUER
          value: "https://api.therr.com"
        - name: JWT_AUDIENCE
          value: "therr-app"
        - name: STRIPE_WEBHOOK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-webhook-secret
              key: STRIPEWEBHOOKSECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret-key
              key: STRIPESECRETKEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: twilio-account-sid
              key: TWILIOACCOUNTSID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-auth-token
              key: TWILIOAUTHTOKEN
        - name: TWILIO_SENDER_PHONE_NUMBER
          value: "+14783124948"
        - name: TWILIO_SENDER_PHONE_NUMBER_GB
          value: "+447700158631"
        - name: TWITTER_APP_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: twitter-app-bearer-token
              key: TWITTERAPPBEARERTOKEN
        - name: JWT_EMAIL_SECRET
          valueFrom:
            secretKeyRef:
              name: therrjwtemailsecret
              key: THERRJWT_EMAIL_SECRET
      - name: cloud-sql-proxy
        # It is recommended to use the latest version of the Cloud SQL proxy
        # Make sure to update on a regular schedule!
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
        args:
          # If connecting from a VPC-native GKE cluster, you can use the
          # following flag to have the proxy connect over private IP
          - "--private-ip"

          # Enable structured logging with LogEntry format:
          - "--structured-logs"

          # Replace DB_PORT with the port the proxy should listen on
          - "--port=5432"

          # This is a plain container, not a native sidecar, so it receives
          # SIGTERM at the same instant the app container's preStop hook starts —
          # and by default the proxy closes its listener immediately, which is the
          # "accept tcp 127.0.0.1:5432: use of closed network connection" line in
          # production logs. That would pull the database out from under the
          # graceful drain in src/index.ts. Outlast the app's whole shutdown
          # budget (15s preStop + 25s hard timeout = 40s) while staying under
          # terminationGracePeriodSeconds: 45. The proxy still exits early once
          # its open connection count reaches zero, so this costs nothing when
          # the drain finishes quickly.
          - "--max-sigterm-delay=42s"
          - "therr-app:us-central1:therr-db-main-prod-14"
        securityContext:
          # The default Cloud SQL proxy image runs as the
          # "nonroot" user and group (uid: 65532) by default.
          runAsNonRoot: true
            # You should use resource requests/limits as a best practice to prevent
            # pods from consuming too many resources and affecting the execution of
            # other pods. You should adjust the following values based on what your
            # application needs. For details, see
            # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          requests:
            memory: "16Mi"
            cpu: "5m"
          limits:
            memory: "64Mi"
            cpu: "50m"
