apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps-service-deployment
  namespace: default
spec:
  replicas: 1
  # Recreate tore down the old pod BEFORE the new one existed. At replicas: 1 that
  # is a guaranteed zero-endpoint window on every deploy, and kube-proxy answers a
  # ClusterIP with no endpoints by refusing the connection — so the gateway saw
  # ECONNREFUSED on 7773 rather than a retryable timeout. maxUnavailable: 0 keeps
  # the running pod serving until the replacement passes its readiness probe.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A pod that answers /healthcheck once and then dies shouldn't retire the old one.
  minReadySeconds: 15
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      component: server-maps
  template:
    metadata:
      labels:
        component: server-maps
        tier: microservices
        layer: services-internal
    spec:
      serviceAccountName: therr-k8s-service-account
      # src/index.ts has no SIGTERM handler, so the process exits as soon as the
      # signal lands. The preStop sleep is what buys the drain: it holds the
      # container open while kube-proxy removes this pod from the Service, so no
      # new requests arrive and in-flight ones finish. 30s leaves 15s of slack
      # past the sleep.
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: cloud.google.com/gke-preemptible
                operator: Exists
            weight: 80
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - server-maps
              topologyKey: kubernetes.io/hostname
      containers:
      - name: server-maps
        image: therrapp/maps-service:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        ports:
        - containerPort: 7773
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 7773
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 7773
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        # Endpoint removal and SIGTERM race each other. Sleeping here keeps the
        # process serving while kube-proxy/ingress finish dropping this pod from
        # rotation, so the gateway stops seeing connection-refused mid-deploy.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"]
        env:
        - name: MAPS_SERVICE_API_PORT
          value: "7773"
        - name: URI_WHITELIST
          value: "https://therr.com,https://www.therr.com"
        - name: HONEYCOMB_API_KEY
          valueFrom:
            secretKeyRef:
              name: honeycomb-writekey
              key: HONEYCOMB
        - name: IMAGE_KIT_URL
          value: "https://ik.imagekit.io/qmtvldd7sl/"
        - name: IMAGE_KIT_URL_PRIVATE
          value: "https://ik.imagekit.io/qmtvldd7sl/private/"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: LOG_LEVEL
          value: "info"
        - name: MAPS_SERVICE_GOOGLE_CREDENTIALS_BASE64
          valueFrom:
            secretKeyRef:
              name: maps-service-google-app-credentials
              key: MAPS_SERVICE_GOOGLE_APP_CREDENTIALS
        - name: BUCKET_PUBLIC_USER_DATA
          value: "therr-public-user-data"
        - name: BUCKET_PRIVATE_USER_DATA
          value: "therr-private-user-data"
        - name: DB_USER_MAIN_WRITE
          value: "therrAppUser"
        - name: DB_HOST_MAIN_WRITE
          value: "127.0.0.1"
        - name: DB_PORT_MAIN_WRITE
          value: "5432"
        - name: DB_PASSWORD_MAIN_WRITE
          valueFrom:
            secretKeyRef:
              name: db-password-app
              key: DB_PASSWORD_APP_WRITE
        - name: DB_USER_MAIN_READ
          value: "therrAppUser"
        - name: DB_HOST_MAIN_READ
          value: "127.0.0.1"
        - name: DB_PORT_MAIN_READ
          value: "5432"
        - name: DB_PASSWORD_MAIN_READ
          valueFrom:
            secretKeyRef:
              name: db-password-app
              key: DB_PASSWORD_APP_READ
        - name: MAPS_SERVICE_DATABASE
          value: "therr_maps_service_db"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: therrjwtsecret
              key: THERRJWT_SECRET
        # IndexNow: Must match the same key set on client-web deployment
        - name: INDEXNOW_API_KEY
          value: "bf9415ba04c845a797fdc30bc27df2d7"
        - name: SIGHTENGINE_API_KEY
          value: "109708716"
        - name: SIGHTENGINE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: sightengineapisecret
              key: SIGHTENGINE_API_SECRET
      - name: cloud-sql-proxy
        # It is recommended to use the latest version of the Cloud SQL proxy
        # Make sure to update on a regular schedule!
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
        args:
          # If connecting from a VPC-native GKE cluster, you can use the
          # following flag to have the proxy connect over private IP
          - "--private-ip"

          # Enable structured logging with LogEntry format:
          - "--structured-logs"

          # Replace DB_PORT with the port the proxy should listen on
          - "--port=5432"
          - "--max-connections=20"

          # This is a plain container, not a native sidecar, so it receives
          # SIGTERM at the same instant the app container's preStop hook starts —
          # and by default the proxy closes its listener immediately, which is the
          # "accept tcp 127.0.0.1:5432: use of closed network connection" line in
          # production logs. Outlast the app's preStop sleep while staying under
          # terminationGracePeriodSeconds: 30. The proxy still exits early once
          # its open connection count reaches zero.
          - "--max-sigterm-delay=27s"
          - "therr-app:us-central1:therr-db-main-prod-14"
        securityContext:
          # The default Cloud SQL proxy image runs as the
          # "nonroot" user and group (uid: 65532) by default.
          runAsNonRoot: true
            # You should use resource requests/limits as a best practice to prevent
            # pods from consuming too many resources and affecting the execution of
            # other pods. You should adjust the following values based on what your
            # application needs. For details, see
            # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "96Mi"
            cpu: "100m"
